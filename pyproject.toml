[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yua-memory"
version = "1.0.0"
description = "Emotional Memory Management System for AI Agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bryan & Yua", email = "bryan@yua.system"}
]
keywords = [
    "ai",
    "memory",
    "emotional-intelligence",
    "retrieval",
    "rag",
    "yua"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "schedule>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
telegram = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/bryanchen3777/yua-memory"
Documentation = "https://github.com/bryanchen3777/yua-memory#readme"
Repository = "https://github.com/bryanchen3777/yua-memory"
Issues = "https://github.com/bryanchen3777/yua-memory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["yua_memory*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["yua_memory"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=yua_memory --cov-report=term-missing"
