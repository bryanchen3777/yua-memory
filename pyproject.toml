[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yua-memory"
version = "1.0.0"
description = "Emotional Memory Management System for AI Agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bryan & Yua", email = "bryan@yua.system"}
]
keywords = [
    "ai",
    "memory",
    "emotional-intelligence",
    "retrieval",
    "rag",
    "yua"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
telegram = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/yua-system/yua-memory"
Documentation = "https://docs.yua.memory"
Repository = "https://github.com/yua-system/yua-memory"
Issues = "https://github.com/yua-system/yua-memory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["yua_memory*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["yua_memory"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
